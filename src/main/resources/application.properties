spring.application.name=server_side
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# רושם את הנתונים לקובץ כדי שישמרו לאחר סיום ההרצה (כי המסד קיים ברמת זיכרון)
spring.datasource.url=jdbc:h2:file:./data/testdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
# ליצור ולעדכן טבלאות כפי הצורך jpa מאפשר ל
spring.jpa.hibernate.ddl-auto=update

